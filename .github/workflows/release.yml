name: release-pipeline

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Launcher (Rust) builds in parallel with the native runtimes below,
  # instead of waiting 15-30 min for PHP first. Hands the binary to the
  # bundle job via the launcher-bin-<target> artifact.
  build-launcher:
    name: Build Launcher (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x86_64, os: windows-2025,   bin: prestashop-launcher.exe }
          - { target: macos-arm64,    os: macos-15,       bin: prestashop-launcher }
          - { target: macos-x86_64,   os: macos-15-intel, bin: prestashop-launcher }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build Launcher Binary
        run: cargo build --release --locked -p prestashop-launcher
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-bin-${{ matrix.target }}
          path: target/release/${{ matrix.bin }}

  build-binaries:
    name: Build & Bundle (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x86_64, os: windows-2025,   ext: zip,    bin: prestashop-launcher.exe }
          # TODO(linux): re-enable after fixing spc pkg-config source
          # build failure (make -j4 fails on ubuntu-24.04 runner).
          # - { target: linux-x86_64,   os: ubuntu-24.04, ext: tar.xz, bin: prestashop-launcher }
          - { target: macos-arm64,    os: macos-15,       ext: tar.xz, bin: prestashop-launcher }
          - { target: macos-x86_64,   os: macos-15-intel, ext: tar.xz, bin: prestashop-launcher }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfontconfig1-dev libx11-dev libxext-dev libxfixes-dev libxinerama-dev libxrandr-dev libxcursor-dev xz-utils musl-tools

      - name: Install macOS build tools (autotools for php-src buildconf)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config || true

      # 2. Cache Runtime Binaries (PHP, Nginx, MariaDB)
      - name: Cache Runtime Components
        id: cache-runtime
        uses: actions/cache@v4
        with:
          path: build/runtime/${{ matrix.target }}
          key: runtime-${{ matrix.target }}-${{ hashFiles('versions.env', 'ci/**') }}

      # 3. Build / Fetch Runtimes (Hanya jalan jika cache miss)
      - name: Build Runtime Binaries
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        run: ./ci/build-runtime.sh ${{ matrix.target }}
        shell: bash
        env:
          # spc resolves sources via api.github.com (e.g. madler/zlib);
          # shared runners hit the unauthenticated rate limit (403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Fetch prebuilt Launcher Binary (built in parallel job)
      - name: Download Launcher Binary
        uses: actions/download-artifact@v4
        with:
          name: launcher-bin-${{ matrix.target }}
          path: build/launcher-bin

      # 5. Rakit Paket & PrestaShop Core
      - name: Package Distribution
        run: ./ci/package-bundle.sh ${{ matrix.target }} ${{ matrix.ext }}
        shell: bash
        env:
          LAUNCHER_BIN: build/launcher-bin/${{ matrix.bin }}

      # 6. Automated Smoke Test di Runner
      - name: Run Smoke Tests
        run: ./ci/smoke-test.sh ${{ matrix.target }}
        shell: bash

      # 7. Upload Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: prestashop-portable-${{ matrix.target }}
          path: dist/*.${{ matrix.ext }}

  publish-release:
    needs: [build-launcher, build-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Compute Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-assets/*
          generate_release_notes: true
